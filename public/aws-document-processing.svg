<rect class="node primary" x="280" y="174" width="192" height="78" rx="12"/><text class="t" x="376" y="206">API Gateway</text><text class="s" x="376" y="228">HTTP requests</text>
<rect class="node primary" x="540" y="174" width="210" height="78" rx="12"/><text class="t" x="645" y="205">Lambda / ECS</text><text class="s" x="645" y="228">Backend</text>
<rect class="node secondary" x="860" y="117" width="265" height="78" rx="12"/><text class="t" x="992" y="151">S3</text><text class="s" x="992" y="173">Uploaded documents</text>
<rect class="node secondary" x="860" y="229" width="265" height="78" rx="12"/><text class="t" x="992" y="263">DynamoDB</text><text class="s" x="992" y="285">Metadata &amp; processing state</text>
<rect class="node primary" x="540" y="345" width="210" height="89" rx="12"/><text class="t" x="645" y="380">SNS</text><text class="s" x="645" y="403">Document uploaded</text>
