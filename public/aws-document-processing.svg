<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AI document processing on AWS</title><desc id="desc">User sends requests to API Gateway and Lambda or ECS backend. Backend writes to S3 and DynamoDB, publishes to SNS and SQS for Lambda processing and Bedrock summarization. AI agent invokes approved tools through AgentCore Gateway.</desc>
<rect width="1200" height="680" fill="#f8fafc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1e293b}.head{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#64748b}.node{stroke:#cbd5e1;stroke-width:2;fill:#fff}.primary{fill:#fff6e8;stroke:#e4a54c}.secondary{fill:#eff6ff;stroke:#88b7eb}.t{font-size:17px;font-weight:700;text-anchor:middle}.s{font-size:13px;fill:#64748b;text-anchor:middle}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arr)}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<text class="head" x="55" y="58">AI Document Processing — Example AWS Architecture</text><text class="sub" x="55" y="88">Simplified request, storage, messaging, and AI processing paths</text>
